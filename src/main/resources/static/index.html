<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CampusMarket — Student Marketplace</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d0d0f;
      --surface: #16161a;
      --surface2: #1e1e24;
      --border: #2a2a35;
      --accent: #7c6dfa;
      --accent2: #f0c040;
      --text: #eeeef0;
      --muted: #888898;
      --success: #3ecf8e;
      --danger: #f06060;
      --radius: 14px;
      --font-head: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
    }

    /* NAVBAR */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,13,15,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-brand {
      font-family: var(--font-head);
      font-size: 1.3rem; font-weight: 800;
      color: var(--text); text-decoration: none;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .nav-brand span { color: var(--accent); }
    .nav-actions { display: flex; align-items: center; gap: 1rem; }
    .search-bar {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.45rem 0.9rem;
      transition: border-color 0.2s;
    }
    .search-bar:focus-within { border-color: var(--accent); }
    .search-bar input {
      background: none; border: none; outline: none;
      color: var(--text); font-family: var(--font-body);
      font-size: 0.88rem; width: 200px;
    }
    .search-bar input::placeholder { color: var(--muted); }
    .search-bar svg { color: var(--muted); flex-shrink: 0; }

    .cart-btn {
      position: relative;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.45rem 1rem;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.88rem;
      cursor: pointer;
      display: flex; align-items: center; gap: 0.5rem;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .cart-btn:hover { border-color: var(--accent); background: var(--surface); }
    .cart-badge {
      position: absolute; top: -6px; right: -6px;
      background: var(--accent); color: #fff;
      font-size: 0.65rem; font-weight: 700;
      border-radius: 50%; width: 18px; height: 18px;
      display: flex; align-items: center; justify-content: center;
      display: none;
    }
    .sell-btn {
      background: var(--accent);
      color: #fff;
      border: none; border-radius: 10px;
      padding: 0.5rem 1.1rem;
      font-family: var(--font-body); font-size: 0.88rem; font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .sell-btn:hover { opacity: 0.88; transform: translateY(-1px); }

    /* HERO */
    .hero {
      padding: 4rem 2rem 2rem;
      text-align: center;
      max-width: 700px; margin: 0 auto;
    }
    .hero-tag {
      display: inline-block;
      background: rgba(124,109,250,0.12);
      color: var(--accent);
      border: 1px solid rgba(124,109,250,0.3);
      border-radius: 100px; padding: 0.3rem 0.9rem;
      font-size: 0.78rem; font-weight: 600; letter-spacing: 0.05em;
      text-transform: uppercase; margin-bottom: 1.2rem;
    }
    .hero h1 {
      font-family: var(--font-head);
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800; line-height: 1.1;
      margin-bottom: 1rem;
    }
    .hero h1 em { color: var(--accent); font-style: normal; }
    .hero p { color: var(--muted); font-size: 1rem; line-height: 1.7; }

    /* FILTERS */
    .filters {
      padding: 1.5rem 2rem 0;
      display: flex; align-items: center; gap: 0.6rem;
      flex-wrap: wrap;
      max-width: 1200px; margin: 0 auto;
    }
    .filter-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 0.4rem 1rem;
      font-family: var(--font-body); font-size: 0.82rem;
      color: var(--muted); cursor: pointer;
      transition: all 0.18s;
    }
    .filter-pill:hover, .filter-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* PRODUCT GRID */
    .section-header {
      max-width: 1200px; margin: 2rem auto 1rem;
      padding: 0 2rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .section-header h2 {
      font-family: var(--font-head); font-size: 1.1rem; font-weight: 700;
    }
    .section-header span { color: var(--muted); font-size: 0.85rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.2rem;
      padding: 0 2rem 4rem;
      max-width: 1200px; margin: 0 auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.22s, border-color 0.22s, box-shadow 0.22s;
      animation: fadeUp 0.4s ease both;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 32px rgba(124,109,250,0.15);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-img {
      width: 100%; height: 180px;
      object-fit: cover;
      background: var(--surface2);
      display: block;
    }
    .card-img-placeholder {
      width: 100%; height: 180px;
      background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem;
    }
    .card-body { padding: 1rem; }
    .card-category {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.07em;
      text-transform: uppercase; color: var(--accent);
      margin-bottom: 0.35rem;
    }
    .card-name {
      font-family: var(--font-head); font-size: 1rem; font-weight: 700;
      margin-bottom: 0.3rem; line-height: 1.3;
    }
    .card-desc {
      font-size: 0.8rem; color: var(--muted);
      line-height: 1.5; margin-bottom: 0.75rem;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-footer {
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-price {
      font-family: var(--font-head); font-size: 1.15rem; font-weight: 700;
      color: var(--accent2);
    }
    .card-seller { font-size: 0.75rem; color: var(--muted); }
    .add-cart-btn {
      background: var(--accent);
      color: #fff; border: none; border-radius: 8px;
      padding: 0.4rem 0.85rem;
      font-family: var(--font-body); font-size: 0.8rem; font-weight: 500;
      cursor: pointer; transition: opacity 0.18s, transform 0.1s;
    }
    .add-cart-btn:hover { opacity: 0.85; transform: scale(1.04); }
    .add-cart-btn:active { transform: scale(0.97); }
    .stock-badge {
      font-size: 0.7rem; color: var(--success);
      margin-top: 0.3rem;
    }
    .stock-low { color: var(--danger); }

    /* TOAST */
    #toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--surface2); border: 1px solid var(--accent);
      color: var(--text); font-size: 0.88rem;
      padding: 0.7rem 1.4rem; border-radius: 100px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
      z-index: 999; pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* MODAL — Sell Item */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
      z-index: 200; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem; width: 90%; max-width: 480px;
      animation: modalIn 0.3s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.94) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal h2 {
      font-family: var(--font-head); font-size: 1.3rem; font-weight: 800;
      margin-bottom: 1.5rem;
    }
    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block; font-size: 0.78rem; color: var(--muted);
      margin-bottom: 0.4rem; font-weight: 500; letter-spacing: 0.04em;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 0.6rem 0.85rem;
      color: var(--text); font-family: var(--font-body); font-size: 0.9rem;
      outline: none; transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--accent);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .modal-actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
    .btn-primary {
      flex: 1; background: var(--accent); color: #fff;
      border: none; border-radius: 10px;
      padding: 0.7rem 1rem; font-family: var(--font-body);
      font-size: 0.9rem; font-weight: 500; cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-ghost {
      background: none; color: var(--muted);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 0.7rem 1rem; font-family: var(--font-body);
      font-size: 0.9rem; cursor: pointer; transition: border-color 0.2s;
    }
    .btn-ghost:hover { border-color: var(--muted); }

    /* LOADING */
    .loading {
      text-align: center; padding: 4rem 2rem;
      color: var(--muted); font-size: 0.9rem;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* EMPTY STATE */
    .empty {
      text-align: center; padding: 5rem 2rem;
      color: var(--muted);
    }
    .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty h3 { font-family: var(--font-head); font-size: 1.1rem; color: var(--text); margin-bottom: 0.5rem; }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav>
  <a class="nav-brand" href="/"><span>Student</span>MarketPlace</a>
  <div class="nav-actions">
    <div class="search-bar">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="searchInput" type="text" placeholder="Search products…" oninput="handleSearch(this.value)"/>
    </div>
    <a href="/cart.html" class="cart-btn">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      Cart
      <span class="cart-badge" id="cartBadge">0</span>
    </a>
    <button class="sell-btn" onclick="openModal()">+ Sell Item</button>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-tag">🎓 For students, by students</div>
  <h1>Buy & Sell on<br><em>Campus</em>, Instantly.</h1>
  <p>The easiest way to trade textbooks, electronics, and more with fellow students.</p>
</div>

<!-- FILTERS -->
<div class="filters" id="filters">
  <button class="filter-pill active" onclick="filterByCategory('', this)">All</button>
  <button class="filter-pill" onclick="filterByCategory('Books', this)">📚 Books</button>
  <button class="filter-pill" onclick="filterByCategory('Electronics', this)">💻 Electronics</button>
  <button class="filter-pill" onclick="filterByCategory('Stationery', this)">✏️ Stationery</button>
  <button class="filter-pill" onclick="filterByCategory('Furniture', this)">🪑 Furniture</button>
  <button class="filter-pill" onclick="filterByCategory('Other', this)">📦 Other</button>
</div>

<!-- SECTION HEADER -->
<div class="section-header">
  <h2 id="sectionTitle">All Listings</h2>
  <span id="productCount"></span>
</div>

<!-- PRODUCT GRID -->
<div class="grid" id="productGrid">
  <div class="loading" style="grid-column: 1/-1">
    <div class="spinner"></div>
    Loading listings…
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- SELL MODAL -->
<div class="modal-overlay" id="sellModal">
  <div class="modal">
    <h2>List an Item</h2>
    <div class="form-row">
      <div class="form-group">
        <label>PRODUCT NAME</label>
        <input type="text" id="pName" placeholder="e.g. Calculus Textbook"/>
      </div>
      <div class="form-group">
        <label>CATEGORY</label>
        <select id="pCategory">
          <option value="Books">Books</option>
          <option value="Electronics">Electronics</option>
          <option value="Stationery">Stationery</option>
          <option value="Furniture">Furniture</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>PRICE (₹ or $)</label>
        <input type="number" id="pPrice" placeholder="0.00" step="0.01" min="0"/>
      </div>
      <div class="form-group">
        <label>STOCK / QTY</label>
        <input type="number" id="pStock" placeholder="1" min="1"/>
      </div>
    </div>
    <div class="form-group">
      <label>SELLER NAME</label>
      <input type="text" id="pSeller" placeholder="Your name"/>
    </div>
    <div class="form-group">
      <label>DESCRIPTION</label>
      <textarea id="pDesc" placeholder="Describe the condition and details…"></textarea>
    </div>
    <div class="form-group">
      <label>IMAGE URL (optional)</label>
      <input type="text" id="pImage" placeholder="https://…"/>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="submitProduct()">List Item →</button>
    </div>
  </div>
</div>

<script>
  let allProducts = [];

  async function loadProducts(url = '/api/products') {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = `<div class="loading" style="grid-column:1/-1"><div class="spinner"></div>Loading listings…</div>`;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('Server error');
      allProducts = await res.json();
      renderProducts(allProducts);
    } catch(e) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
        <div class="empty-icon">⚠️</div>
        <h3>Could not load products</h3>
        <p>Make sure the backend is running on port 8081.</p>
      </div>`;
    }
  }

  function renderProducts(products) {
    const grid = document.getElementById('productGrid');
    document.getElementById('productCount').textContent = `${products.length} listing${products.length !== 1 ? 's' : ''}`;

    if (products.length === 0) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
        <div class="empty-icon">🔍</div>
        <h3>No listings found</h3>
        <p>Try a different search or category.</p>
      </div>`;
      return;
    }

    const emojis = { Books: '📚', Electronics: '💻', Stationery: '✏️', Furniture: '🪑', Other: '📦' };

    grid.innerHTML = products.map((p, i) => `
      <div class="card" style="animation-delay:${i * 0.05}s">
        ${p.imageUrl
          ? `<img class="card-img" src="${p.imageUrl}" alt="${p.name}" onerror="this.parentNode.querySelector('.card-img-placeholder').style.display='flex';this.style.display='none'">`
          : ''
        }
        <div class="card-img-placeholder" style="${p.imageUrl ? 'display:none' : ''}">
          ${emojis[p.category] || '📦'}
        </div>
        <div class="card-body">
          <div class="card-category">${p.category || 'Other'}</div>
          <div class="card-name">${p.name}</div>
          <div class="card-desc">${p.description || 'No description provided.'}</div>
          <div class="stock-badge ${p.stock <= 2 ? 'stock-low' : ''}">
            ${p.stock <= 0 ? '✕ Out of stock' : p.stock <= 2 ? `⚡ Only ${p.stock} left` : `✓ ${p.stock} in stock`}
          </div>
          <div class="card-footer" style="margin-top:0.75rem">
            <div>
              <div class="card-price">$${Number(p.price).toFixed(2)}</div>
              <div class="card-seller">by ${p.seller}</div>
            </div>
            <button class="add-cart-btn" onclick="addToCart(${JSON.stringify(p).replace(/"/g, '&quot;')})" ${p.stock <= 0 ? 'disabled style="opacity:0.4;cursor:not-allowed"' : ''}>
              Add to Cart
            </button>
          </div>
        </div>
      </div>
    `).join('');
  }

  function addToCart(product) {
    let cart = JSON.parse(localStorage.getItem('campus_cart')) || [];
    const existing = cart.find(i => i.id === product.id);
    if (existing) {
      existing.quantity = (existing.quantity || 1) + 1;
    } else {
      cart.push({ ...product, quantity: 1 });
    }
    localStorage.setItem('campus_cart', JSON.stringify(cart));
    updateCartBadge();
    showToast(`${product.name} added to cart 🛒`);
  }

  function updateCartBadge() {
    const cart = JSON.parse(localStorage.getItem('campus_cart')) || [];
    const total = cart.reduce((s, i) => s + (i.quantity || 1), 0);
    const badge = document.getElementById('cartBadge');
    badge.textContent = total;
    badge.style.display = total > 0 ? 'flex' : 'none';
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  let searchTimer;
  function handleSearch(val) {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      if (val.trim()) {
        document.getElementById('sectionTitle').textContent = `Results for "${val}"`;
        loadProducts(`/api/products?search=${encodeURIComponent(val)}`);
      } else {
        document.getElementById('sectionTitle').textContent = 'All Listings';
        loadProducts();
      }
    }, 350);
  }

  function filterByCategory(cat, btn) {
    document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('sectionTitle').textContent = cat ? `${cat}` : 'All Listings';
    document.getElementById('searchInput').value = '';
    loadProducts(cat ? `/api/products?category=${encodeURIComponent(cat)}` : '/api/products');
  }

  function openModal() {
    document.getElementById('sellModal').classList.add('open');
  }
  function closeModal() {
    document.getElementById('sellModal').classList.remove('open');
  }
  document.getElementById('sellModal').addEventListener('click', e => {
    if (e.target === document.getElementById('sellModal')) closeModal();
  });

  async function submitProduct() {
    const name = document.getElementById('pName').value.trim();
    const price = parseFloat(document.getElementById('pPrice').value);
    const seller = document.getElementById('pSeller').value.trim();
    const category = document.getElementById('pCategory').value;
    const description = document.getElementById('pDesc').value.trim();
    const imageUrl = document.getElementById('pImage').value.trim();
    const stock = parseInt(document.getElementById('pStock').value) || 1;

    if (!name || !seller || isNaN(price)) {
      showToast('⚠️ Please fill in all required fields');
      return;
    }

    try {
      const res = await fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price, seller, category, description, imageUrl, stock })
      });
      if (!res.ok) throw new Error();
      closeModal();
      showToast('🎉 Item listed successfully!');
      loadProducts();
      ['pName','pPrice','pSeller','pDesc','pImage','pStock'].forEach(id => document.getElementById(id).value = '');
    } catch {
      showToast('❌ Failed to list item. Try again.');
    }
  }

  updateCartBadge();
  loadProducts();
</script>
</body>
</html>
